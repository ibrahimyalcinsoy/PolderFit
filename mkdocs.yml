site_name: Python tool for bbFMR
site_description: bbFMR evaluation – how the code works, tuning and troubleshooting
site_author: Ibrahim Yalcinsoy
copyright: "© 2026 Ibrahim Yalcinsoy – all rights reserved."
docs_dir: docs
theme:
  name: readthedocs
  highlightjs: true
nav:
  - Home: index.md
  - "Quick reference: quantities · formulas · sources": referenz.md
  - Installation and start: installation.md
  - Measurement data (TDMS): datenformate.md
  - Channel mapping and profiles: kanal-mapping.md
  - Color plot processing: verarbeitung.md
  - Evaluation selection (ranges, jumpers): auswertungsauswahl.md
  - Interactive fitting: interaktives-fitten.md
  - Outliers, projects, settings: ausreisser.md
  - Pipeline: pipeline.md
  - AutoWindow: autowindow.md
  - Physics and fit: physik-und-fit.md
  - Fit rating: bewertung.md
  - Parameters and tuning: tuning.md
  - Troubleshooting: troubleshooting.md
  - Comparison with LabVIEW FTF: vergleich-ftf.md
  - Robustness check (real data): test-harness.md
# Links outside the docs tree: no warning.
validation:
  links:
    not_found: info
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - tables
  - fenced_code
